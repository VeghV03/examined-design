name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness-checks-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skills — every skill has a name that matches its folder and a description
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              head = f.read_text().split("---")
              meta = head[1] if len(head) > 2 else ""
              name = re.search(r"^name:\s*(.+)$", meta, re.M)
              desc = re.search(r"^description:\s*(.+)$", meta, re.M)
              if not name or name.group(1).strip() != f.parent.name:
                  bad.append(f"{f}: name must be {f.parent.name}")
              if not desc or len(desc.group(1).strip()) < 40:
                  bad.append(f"{f}: description missing or too short to route on")
          n = len(list(pathlib.Path("skills").glob("*/SKILL.md")))
          print("\n".join(bad) or f"{n} skills, every one named and described")
          sys.exit(1 if bad else 0)
          PY

      - name: Install Playwright (Python, for the renders; Node, for the checks)
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          cd checks && npm install && npx playwright install chromium

      - name: Demo — the patches rebuild the committed prototype exactly
        run: |
          sh examples/demo/rebuild.sh
          git diff --exit-code examples/demo/prototype.html docs/demo.html || {
            echo "the patches no longer produce the committed prototype (or the Pages copy of it)"; exit 1; }
          python3 harness/build.py examples/demo/prototype.html --check

      - name: Build — a link whose label is not on its board must refuse, writing nothing
        run: |
          set -e
          cp examples/demo/prototype.html /tmp/bad.html
          cp /tmp/bad.html /tmp/bad-before.html
          set +e
          python3 - > /tmp/refuse.txt 2>&1 <<'PY'
          import sys; sys.path.insert(0, "harness")
          import protolib
          p = protolib.Proto("/tmp/bad.html")
          p.link("Files", "Archive everything", "Removed")
          p.save()
          PY
          code=$?
          set -e
          cat /tmp/refuse.txt
          test "$code" != "0" || { echo "an unbound label must stop the save"; exit 1; }
          grep -q "Archive everything" /tmp/refuse.txt
          cmp /tmp/bad.html /tmp/bad-before.html
          echo "  refused, and the file is unchanged"

      - name: Render — boards alone, in light and dark, with no page errors
        run: |
          python3 harness/render.py examples/demo/prototype.html Files RemoveForGoodChecking --both --out /tmp/renders > /tmp/render.txt
          cat /tmp/render.txt
          test "$(grep -c '\.png$' /tmp/render.txt)" = "4"
          if grep -q "page errors" /tmp/render.txt; then exit 1; fi

      - name: Checks — all thirteen against the demo prototype
        working-directory: checks
        run: node run-all.mjs

      - name: Checks test themselves — contrast must composite the veil
        working-directory: checks
        run: node test-fixtures.mjs

      - name: Drift — the scope is compared with the prototype, and the prototype dictates
        run: |
          python3 harness/drift.py examples/demo/scope.md examples/demo/prototype.html > /tmp/drift.txt || true
          cat /tmp/drift.txt
          grep -q 'line 10: "trash"' /tmp/drift.txt

      - name: CLI — init and check against a throwaway project with no prototype
        run: |
          set -e
          rm -rf /tmp/fixture && mkdir -p /tmp/fixture/dist
          cat > /tmp/fixture/package.json <<'JSON'
          { "name": "fixture", "private": true, "devDependencies": { "vite": "^5.0.0" } }
          JSON
          cat > /tmp/fixture/dist/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Home</title></head>
          <body style="font-family:system-ui"><h1>Home</h1>
          <p style="color:#ccc">Pale text nobody can read.</p>
          <a href="/index.html">Home again</a> <a href="/gone.html">Archive</a>
          </body></html>
          HTML

          cd /tmp/fixture
          node "$GITHUB_WORKSPACE/cli/examined.mjs" init > /tmp/cli.txt 2>&1 || { cat /tmp/cli.txt; exit 1; }
          test -f examined.config.json
          grep -q "no <html lang>"                                /tmp/cli.txt
          grep -qE "[1-9][0-9]* boards? with a contrast failure"   /tmp/cli.txt
          grep -q "links needs a served origin"                    /tmp/cli.txt
          grep -q "12 checks · 0 errored"                          /tmp/cli.txt
          # a check that cannot run must say so, not read as a clean pass
          grep -q "2 skipped"                                      /tmp/cli.txt
          # the run writes its findings down, so the next run can tell new from known
          test -s .examined/findings.json
          python3 -c "import json,sys; d=json.load(open('.examined/findings.json')); sys.exit(0 if d['findings'] else 1)"
          echo "  dir mode ok"

          # "/" and "/index.html" are one page; a dead link must be reported once
          ( cd dist && python3 -m http.server 8099 >/dev/null 2>&1 & echo $! > /tmp/f.pid )
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8099/ && break; sleep 1; done
          cat > examined.config.json <<'JSON'
          { "target": { "mode": "crawl", "start": "http://localhost:8099/", "limit": 25 },
            "widths": [1440], "height": 900, "densityBudget": 400, "targetSize": 24 }
          JSON
          node "$GITHUB_WORKSPACE/cli/examined.mjs" check > /tmp/crawl.txt 2>&1 || true
          kill "$(cat /tmp/f.pid)" 2>/dev/null || true
          grep -q "1 link that does not resolve" /tmp/crawl.txt || {
            echo "expected exactly one unresolved link"; grep -A3 "links" /tmp/crawl.txt; exit 1; }
          echo "  crawl mode ok"

      - name: Backlog — the plan resolves, emits, and does not duplicate itself
        run: |
          set -e
          B="python3 backlog/build_backlog.py"

          # Standalone first: a plan written from a brief, with no prototype anywhere.
          $B --plan examples/standalone-backlog/backlog.plan.json \
             --config examples/standalone-backlog/backlog.config.json --out /tmp/sa > /tmp/sa.txt
          cat /tmp/sa.txt
          grep -q "2 epics · 6 stories · 10 sub-tasks · 1 spike" /tmp/sa.txt
          grep -q "1 with nothing serving it" /tmp/sa.txt
          test -f /tmp/sa/jira.csv && test -f /tmp/sa/backlog.md
          echo "  standalone plan ok"

          # The spike must be ranked before the story it blocks, because row order is
          # the only build sequence a Jira CSV can carry.
          python3 - <<'PY'
          import json
          u = {x["key"]: x for x in json.load(open("/tmp/sa/backlog.json"))["units"]}
          assert u["spike:tax-fields"]["rank"] < u["story:set-up/details"]["rank"], "spike must outrank what it blocks"
          assert "spike:tax-fields" in u["story:set-up/details"]["blocked_by"]
          assert u["story:get-paid/chase"]["rank"] > u["story:get-paid/send"]["rank"]
          print("  build order ok")
          PY

          # Same emitter, read from the prototype.
          P=examples/demo/prototype.html
          C=examples/demo/backlog.config.json
          $B --prototype $P --config $C --out /tmp/md1 > /tmp/m1.txt
          cat /tmp/m1.txt
          grep -q "4 epics · 9 stories · 15 sub-tasks · 1 spike" /tmp/m1.txt
          # every sub-task carries its board's required text, pointed at the board
          grep -q 'Required text (proto: RemoveForGoodChecking)' /tmp/md1/backlog.md
          echo "  prototype front end ok"

          # Deterministic: same input, byte-identical output.
          $B --prototype $P --config $C --out /tmp/md2 > /dev/null
          for f in backlog.json jira.csv backlog.md; do cmp /tmp/md1/$f /tmp/md2/$f; done
          echo "  deterministic"

          # Re-run into the same directory must report nothing and duplicate nothing.
          $B --prototype $P --config $C --out /tmp/md1 > /tmp/m2.txt
          if grep -qE "^  (added|changed|gone) " /tmp/m2.txt; then
            echo "an unchanged re-run must report nothing"; cat /tmp/m2.txt; exit 1; fi
          echo "  re-run is quiet"

          # A reworded step keeps its ticket; only a restructure makes new work.
          cp $P /tmp/renamed.html
          python3 - <<'PY'
          import sys; sys.path.insert(0, "harness")
          import protolib
          p = protolib.Proto("/tmp/renamed.html")
          p.set_step("B", "B2", title="Move a file into a folder without sharing it")
          p.save()
          PY
          $B --prototype /tmp/renamed.html --config $C --out /tmp/md1 > /tmp/m3.txt
          grep -q "changed  S-b-b2" /tmp/m3.txt
          if grep -q "added    S-b" /tmp/m3.txt; then
            echo "a rename must not create a new ticket"; cat /tmp/m3.txt; exit 1; fi
          echo "  rename keeps identity"

          # A plan that does not resolve is refused by name, not emitted with a hole.
          cat > /tmp/bad.json <<'JSON'
          {"version":1,"epics":[{"id":"a","name":"A"}],
           "stories":[{"id":"a/one","epic":"a","name":"One","blocked_by":["a/nope"]}]}
          JSON
          set +e; $B --plan /tmp/bad.json --out /tmp/bad > /tmp/bad.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "a dangling reference must stop the build"; cat /tmp/bad.txt; exit 1; }
          grep -q "is blocked by story:a/nope, which is not declared" /tmp/bad.txt
          echo "  dangling reference refused"

          cat > /tmp/cyc.json <<'JSON'
          {"version":1,"epics":[{"id":"a","name":"A"}],
           "stories":[{"id":"a/one","epic":"a","name":"One","blocked_by":["a/two"]},
                      {"id":"a/two","epic":"a","name":"Two","blocked_by":["a/one"]}]}
          JSON
          set +e; $B --plan /tmp/cyc.json --out /tmp/cyc > /tmp/cyc.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "a cycle must stop the build"; exit 1; }
          grep -q "blocked-by cycle" /tmp/cyc.txt
          echo "  blocked-by cycle refused"

          # push is the only part that reaches outside. Its guards are tested against
          # a stubbed Jira rather than trusted: no network, no tickets, every rule real.
          python3 backlog/push_test.py

          # and it must refuse to create anything with no terminal to confirm at
          set +e
          $B --prototype $P --config $C --out /tmp/np --push < /dev/null > /tmp/np.txt 2>&1
          code=$?
          set -e
          test "$code" = "1" || { echo "push must fail without credentials or a terminal"; cat /tmp/np.txt; exit 1; }
          grep -q "STOP" /tmp/np.txt
          echo "  push refuses in a non-interactive shell"

      - name: Ratchet — a baselined finding is quiet, a new one refuses
        run: |
          set -e
          cd /tmp/fixture
          EX="node $GITHUB_WORKSPACE/cli/examined.mjs"
          cat > examined.config.json <<'JSON'
          { "target": { "mode": "dir", "dir": "./dist" },
            "widths": [1440], "height": 900, "densityBudget": 400, "targetSize": 24 }
          JSON

          $EX baseline > /tmp/base.txt 2>&1 || { cat /tmp/base.txt; exit 1; }
          grep -q "Recorded" /tmp/base.txt
          test -f examined.baseline.json
          echo "  baseline written"

          # The same findings, now known: the ratchet must be silent and exit 0.
          $EX check --no-new > /tmp/r1.txt 2>&1 || { echo "a baselined run must pass"; cat /tmp/r1.txt; exit 1; }
          grep -q "0 new" /tmp/r1.txt
          echo "  baselined run passes"

          # A screen nobody checked before, carrying exactly one finding nobody
          # accepted. It declares a lang so the heading is the only thing new —
          # the assertions below are about the ratchet, not about the page.
          cat > dist/settings.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Settings</title></head>
          <body style="font-family:system-ui"><div>Settings</div></body></html>
          HTML
          set +e; $EX check --no-new > /tmp/r2.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "a new finding must fail, got exit $code"; cat /tmp/r2.txt; exit 1; }
          grep -q "new since the baseline" /tmp/r2.txt
          grep -q "structure · settings: no heading element" /tmp/r2.txt
          echo "  new finding refuses"

          # A recorded decision is accepted; an unexplained one is not.
          FP=$(grep "structure · settings: no heading element" /tmp/r2.txt | awk '{print $1}')
          test -n "$FP"
          $EX waive "$FP" --why "Fixture screen, heading lands with the redesign" --until 2999-01-01
          $EX check --no-new > /tmp/r3.txt 2>&1 || { echo "a waived finding must pass"; cat /tmp/r3.txt; exit 1; }
          grep -q "1 waived" /tmp/r3.txt
          echo "  waiver accepted"

          set +e; $EX waive deadbeefcafe > /tmp/r4.txt 2>&1; code=$?; set -e
          test "$code" = "2" || { echo "a waiver with no --why must be refused, got exit $code"; exit 1; }
          grep -q "an opinion that won" /tmp/r4.txt
          echo "  waiver without a reason refused"

          # An expired waiver brings its finding straight back.
          python3 - <<'PY'
          import json
          p = "examined.waivers.json"
          d = json.load(open(p))
          for w in d["waivers"]: w["until"] = "2020-01-01"
          json.dump(d, open(p, "w"), indent=2)
          PY
          set +e; $EX check --no-new > /tmp/r5.txt 2>&1; code=$?; set -e
          test "$code" = "1" || { echo "an expired waiver must stop protecting, got exit $code"; cat /tmp/r5.txt; exit 1; }
          grep -q "waiver expired" /tmp/r5.txt
          echo "  expired waiver refuses again"

      - name: Paper — the LaTeX source is present with its figures and PDF
        run: |
          test -s docs/paper/examined-design.tex
          test -s docs/paper/examined-design.pdf
          test -s docs/paper/figures/figs.tex
