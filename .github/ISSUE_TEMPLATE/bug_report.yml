name: Bug report
description: The build, a check, the viewer, the backlog or a skill did something other than what it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most useful with the exact input attached: the smallest prototype, or the shortest sequence of
        patches, that still reproduces it.

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - harness/build.py (derive, refuse, report)
        - harness/protolib.py (create, edit, save, upgrade)
        - the viewer (harness/src/)
        - harness/render.py or harness/drift.py
        - checks/ (a printing check, the runner, baseline or waive)
        - backlog/
        - a skill or command
        - install script
        - something else
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What it says should happen
      description: Point at the line in AGENTS.md, docs/reference.md, the check's header or the SKILL.md if you can.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Command and input that reproduce it
      description: The exact command you ran, and the prototype or patch that triggers it.
      render: shell
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: Agent (Claude Code / Codex / other), OS, Python and Node versions, Chromium version if a check or render is involved.
